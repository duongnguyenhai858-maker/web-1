<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Collection - Homepage</title>
</head>
<body>
    <!-- Hình nền -->
    <div class="bg-container">
        <img src="img/background steam.jpg" alt="background">
    </div>

    <!-- Thanh trợ giúp (Navbar) -->
    <nav class="navbar">
        <div class="logo">STEAM CLONE</div>
        <ul class="nav-links">
            <li><a href="#">Trang chủ</a></li>
            <li><a href="#">Cửa hàng</a></li>
            <li><a href="#">Thư viện</a></li>
            <li><a href="#">Trợ giúp</a></li>
        </ul>
    </nav>

    <!-- Nội dung chính -->
    <main class="main-content">
        <div class="card my-box1">
            <img src="img/hl2.jpg" alt="Half-Life 2" class="profile-photo">
            <h3>Half-Life 2</h3>
            <p>Welcome to City 17.</p>
        </div>

        <div class="card my-box2">
            <img src="img/portal.jpg" alt="Portal" class="profile-photo">
            <h3>Portal</h3>
            <p>The cake is a lie.</p>
        </div>
    </main>
</body>
</html>
