<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="dangki.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in page</title>
</head>

<body>
    <div class="a">
        <h1>Sign up</h1>
        <label for="fullname">Họ và Tên:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Nhập họ và tên" required>
        <label for="password">Mật khẩu:</label>
        <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
        <label for="email">Email:</label>
        <input type="text" id="email" name="email" placeholder="Nhập email" required>
        <label>Sex:</label>
        <div style="margin-bottom: 15px;">
            <input type="radio" id="male" name="gender" value="male" style="width: auto;">
            <label id=b for="male">Nam</label>
            <input type="radio" id="female" name="gender" value="female" style="width: auto; margin-left: 15px;">
            <label id=a for="female">Nữ</label>
            <input type="radio" id="female" name="gender" value="female" style="width: auto; margin-left: 15px;">
            <label id=c for="another">Khác</label>
        </div>
        <button type="submit">Done</button>
        <a id=d href="dangnhap.HTML">Đăng nhập</a>
    </div>
    <div class="bg-container">
        <img src="img/background steam.jpg" alt="background">
    </div>
</body>
</html>
